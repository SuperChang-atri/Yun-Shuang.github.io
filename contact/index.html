<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — MSB | UESTC</title>
  <meta name="description" content="Contact the MSB group at UESTC.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-square.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="wrap">
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.lead"></p>
      </div>
    </section>

    <section class="page-body">
      <div class="wrap">
        <div class="contact-grid">
          <div>
            <div class="contact-item">
              <h3 data-i18n="contact.email"></h3>
              <p><a href="mailto:fmrifanys@uestc.edu.cn">fmrifanys@uestc.edu.cn</a></p>
            </div>
            <div class="contact-item">
              <h3 data-i18n="contact.affil"></h3>
              <p data-i18n="contact.affil.v"></p>
            </div>
            <div class="contact-item">
              <h3 data-i18n="contact.address"></h3>
              <p data-i18n="contact.address.v"></p>
            </div>
            <div class="contact-item">
              <h3 data-i18n="contact.join"></h3>
              <p data-i18n="contact.join.p"></p>
            </div>
          </div>

          <div class="qr-box">
            <img src="/assets/img/wechat-qr.jpg" alt="WeChat Official Account QR code">
            <h3 data-i18n="contact.wechat"></h3>
            <p data-i18n="contact.wechat.p"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/site.js"></script>
</body>
</html>
