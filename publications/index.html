<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications — MSB | UESTC</title>
  <meta name="description" content="Publications of the MSB group, automatically synced from Google Scholar.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-square.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="publications">
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="wrap">
        <h1 data-i18n="publications.title"></h1>
        <p data-i18n="publications.lead"></p>
      </div>
    </section>

    <section class="page-body">
      <div class="wrap">
        <div class="pub-stats" id="pub-stats"></div>

        <div class="pub-toolbar">
          <input class="pub-search" id="pub-search" type="search" data-i18n-ph="publications.search">
          <span class="pub-updated" id="pub-updated"></span>
        </div>

        <div id="pub-list"></div>
        <div class="pagination" id="pub-pages"></div>

        <p class="mt-24">
          <a href="https://scholar.google.com/citations?user=CY_RlkAAAAAJ&hl=en" target="_blank" rel="noopener" data-i18n="publications.viewall"></a> →
        </p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/publications.js"></script>
</body>
</html>
