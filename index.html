<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSB — Mapping Schizophrenia Brain | UESTC</title>
  <meta name="description" content="The MSB (Mapping Schizophrenia Brain) group at UESTC studies the neural mechanisms of schizophrenia with multimodal MRI, connectomics and machine learning. Led by Dr. Yunshuang Fan.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-square.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="home">
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-kicker" data-i18n="home.kicker"></div>
        <h1 data-i18n="home.title"></h1>
        <p data-i18n="home.lead"></p>
      </div>
    </section>

    <section class="section" id="team-section">
      <div class="wrap">
        <div class="team-head">
          <div>
            <h2 class="section-title" data-i18n="home.team.title"></h2>
            <p class="section-sub team-sub" data-i18n="home.team.lead"></p>
          </div>
          <div class="team-head-right">
            <span class="team-hint" id="team-hint"></span>
            <button class="team-toggle" id="team-toggle" aria-expanded="false" aria-controls="team-reveal" aria-label="Toggle group photo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
        </div>

        <div class="team-reveal" id="team-reveal" aria-hidden="true">
          <div class="team-reveal-inner">
            <figure class="team-photo-wrap">
              <!-- 已接入真实合照：assets/img/group-photo.jpg（2000px 宽，403KB） -->
              <img id="team-photo" src="/assets/img/group-photo.jpg"
                   alt="MSB group photo" data-i18n-alt="home.team.alt" loading="lazy">
            </figure>
            <div class="team-caption">
              <span data-i18n="home.team.caption"></span>
              <span data-i18n="home.team.location"></span>
            </div>
            <div class="team-chips" id="team-chips"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2 class="section-title" data-i18n="home.hl.title"></h2>
        <div class="section-sub"></div>
        <div class="hl-grid">
          <div class="hl-item">
            <h3><span class="hl-num">01</span><span data-i18n="home.hl.1.t"></span></h3>
            <p data-i18n="home.hl.1.p"></p>
          </div>
          <div class="hl-item">
            <h3><span class="hl-num">02</span><span data-i18n="home.hl.2.t"></span></h3>
            <p data-i18n="home.hl.2.p"></p>
          </div>
          <div class="hl-item">
            <h3><span class="hl-num">03</span><span data-i18n="home.hl.3.t"></span></h3>
            <p data-i18n="home.hl.3.p"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2 class="section-title" data-i18n="home.news.title"></h2>
        <div class="section-sub"></div>
        <ul class="news-list">
          <li><span class="news-date" data-i18n="home.news.1.d"></span><span data-i18n="home.news.1.t"></span></li>
          <li><span class="news-date" data-i18n="home.news.2.d"></span><span data-i18n="home.news.2.t"></span></li>
          <li><span class="news-date" data-i18n="home.news.3.d"></span><span data-i18n="home.news.3.t"></span></li>
        </ul>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2 class="section-title" data-i18n="home.pi.title"></h2>
        <div class="section-sub"></div>
        <div id="home-pi"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/people.js"></script>
  <script src="/assets/js/team.js"></script>
  <script>MSBPeople.renderPI(document.getElementById("home-pi"));</script>
</body>
</html>
